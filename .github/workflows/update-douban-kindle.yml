name: Update Douban Kindle Screensaver

on:
  workflow_dispatch:

  push:
    branches:
      - public-ready

  schedule:
    - cron: "17 6,18 * * *"
      timezone: "Asia/Shanghai"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Register bundled Chinese font
        run: |
          mkdir -p ~/.local/share/fonts
          cp fonts/NotoSerifCJKsc-Regular.otf ~/.local/share/fonts/
          fc-cache -f

      - name: Install dependencies
        run: npm ci

      - name: Read project config
        run: |
          DOUBAN_USER_ID="$(node -p "require('./config.json').doubanUserId")"
          if [ -z "$DOUBAN_USER_ID" ]; then
            echo "config.json: doubanUserId is empty"
            exit 1
          fi
          echo "DOUBAN_USER_ID=$DOUBAN_USER_ID" >> "$GITHUB_ENV"

      - name: Resolve Douban profile
        run: node resolve-profile.js

      - name: Inspect one-page reading JSON
        run: |
          npx @marvae24/douban-cli book user "$DOUBAN_USER_ID" --reading --json > reading-one-page.json
          node -e "const fs=require('fs'); console.log(fs.readFileSync('reading-one-page.json','utf8').slice(0,6000))"
          exit 1
